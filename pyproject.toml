[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pageproof-portfolio"
version = "0.1.0"
description = "Read the answer. Check the page."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "pymupdf>=1.24,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
ai = ["langchain-openai>=1,<2"]

[project.scripts]
pageproof = "pageproof.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
